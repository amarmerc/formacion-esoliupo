# Publica la carpeta presentacion/ en GitHub Pages (ver módulo 10).
# Requisito: en Settings -> Pages, "Source" debe ser "GitHub Actions".
name: Publicar presentación

on:
  push:
    branches: [main]
    paths: ["presentacion/**", ".github/workflows/pages.yml"]
  workflow_dispatch:        # permite lanzarla a mano desde la pestaña Actions

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: presentacion
      - id: deployment
        uses: actions/deploy-pages@v4
